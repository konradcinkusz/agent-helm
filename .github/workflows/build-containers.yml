# Builds and publishes the AgentHelm images to GitHub Container Registry
# when a release tag is pushed (e.g. v1.0.0). Create a release via the GitHub
# UI — that automatically creates the tag and triggers this workflow. Images:
#   ghcr.io/konradcinkusz/agenthelm-bridge
#   ghcr.io/konradcinkusz/agenthelm-web
#
# Each release produces three image tags: the version (e.g. v1.0.0), major.minor
# (e.g. v1.0) and latest. The workflow_dispatch trigger allows a manual re-run
# from the Actions tab without pushing a new tag.
#
# Pull requests that change the Dockerfiles, .dockerignore, nuget.config or
# this workflow build both images without pushing, and check that the Bridge
# image turns healthy — so a broken Dockerfile shows up on the PR, not on the
# next release tag.
#
# Note: packages published by a workflow are private by default — flip them to
# public once in GitHub → Packages → <package> → Settings → Change visibility,
# so users can `docker pull` without authentication.
name: build containers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.web'
      - '.dockerignore'
      - 'nuget.config'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: agenthelm-bridge
            dockerfile: Dockerfile
          - image: agenthelm-web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The compose files set an API token, so start the Bridge with one: the
      # health check has to pass on a token-protected Bridge.
      - name: Check that the Bridge image turns healthy
        if: github.event_name == 'pull_request' && matrix.image == 'agenthelm-bridge'
        run: |
          image="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker run -d --name bridge -e AgentHelm__ApiToken=ci-token --health-interval 2s "$image"
          for _ in $(seq 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bridge)"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs bridge
          docker inspect --format '{{json .State.Health}}' bridge
          exit 1
