name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test first — no green, no release
        run: |
          dotnet build AgentHelm.sln -c Release
          dotnet test tests/AgentHelm.Tests -c Release --no-build

      # Portable (framework-dependent) publish: ONE zip for every OS with the
      # .NET 8 / ASP.NET Core runtime. Agents need their own runtimes anyway,
      # so requiring dotnet is not an extra burden for this audience. The
      # layout comes from the same script ci.yml smoke-tests on every PR.
      - name: Build the release layout
        run: bash scripts/build-release-layout.sh dist

      - name: Assemble zip
        run: cd dist && zip -rq ../agenthelm-${GITHUB_REF_NAME}.zip .

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: agenthelm-*.zip
          generate_release_notes: true
